<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page metadata and stylesheet -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Site page heading -->
    <header>Contact Us</header>

    <main>
        <!-- Navigation links to the other site pages -->
        <nav>
            <ul>
                <li><a href="Index.html">Home</a></li>
                <li><a href="About Us.html">About Us</a></li>
                <li><a href="Events.html">Events</a></li>
                <li><a href="Contact Us.html">Contact Us</a></li>
                <li><a href="Gallery.html">Gallery</a></li>
            </ul>
        </nav>

        <hr>

        <!-- Contact page introduction and image -->
        <section>
            <h1>Contact Us</h1>
            <p>Feel free to reach out to us with any questions or inquiries!</p>
            <img src="Contact Us.jpg" alt="Image of social media and platforms to contact someone" width="700" class="Contact us img">
        </section>

        <!-- Form for visitors to send a message -->
        <form class="contact-form">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>

    <!-- Site footer -->
    <footer></footer>
</body>
</html>
